name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Suite completa todas las noches: detecta regresiones o cambios en los
    # sitios públicos aunque no haya push ese día.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Traceability (docs/*.feature <-> specs)
        run: npm run check:traceability

      # En push/PR corremos solo @smoke para feedback rápido; la suite
      # completa (incluye @regression, @negative y los 4 browsers/projects)
      # corre en el cron nocturno o manualmente con workflow_dispatch.
      - name: Run smoke tests
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run test:smoke

      - name: Run full suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
